  - id: no-bare-except
    description: "맨몸 except: 를 사용하지 않아야 한다"
    severity: error
  - id: resource-context-manager
    description: "파일/커넥션 등 해제가 필요한 자원은 with로 열어야 한다"
    severity: warning
