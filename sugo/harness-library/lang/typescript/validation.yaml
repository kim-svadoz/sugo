harnessId: lang/typescript
checks:
  - id: no-type-escape-hatch
    description: "any/as any/널 단언(!)으로 타입 에러를 회피하지 않아야 한다(진짜 문제 해결 또는 unknown+타입가드, 불가피하면 이유 주석)"
    severity: error
  - id: no-weakened-strict-config
    description: "타입 에러 회피를 위해 tsconfig.json의 strict 계열 설정을 낮추지 않아야 한다"
    severity: error
    auto:
      kind: json-field
      file: "tsconfig.json"
      path: "compilerOptions.strict"
      equals: true
  - id: no-unhandled-promise
    description: "비동기 함수 호출부에 미처리 Promise rejection이 없어야 한다"
    severity: error
