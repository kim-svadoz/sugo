harnessId: lang/java/17
checks:
  - id: records-for-value-types
    description: "불변 데이터 홀더(DTO/값 객체)는 record로 선언해야 한다"
    severity: warning
  - id: sealed-for-closed-hierarchies
    description: "구현을 제한해야 하는 타입 계층은 sealed로 선언해야 한다"
    severity: warning
  - id: pattern-matching-instanceof
    description: "instanceof 직후 수동 캐스팅 대신 패턴 변수를 사용해야 한다"
    severity: warning
  - id: text-blocks-for-multiline
    description: "여러 줄 SQL/JSON 문자열은 텍스트 블록으로 작성해야 한다"
    severity: warning
  - id: switch-expression-no-fallthrough
    description: "switch는 표현식(->) 형태로 쓰고 fall-through에 의존하지 않아야 한다"
    severity: error
