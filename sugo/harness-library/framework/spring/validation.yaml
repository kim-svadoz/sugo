    description: "@Autowired 필드 주입 대신 생성자 주입을 사용해야 한다"
    severity: warning
  - id: entity-not-exposed-directly
    description: "JPA 엔티티를 API 응답으로 직접 노출하지 않아야 한다(DTO 변환 필요)"
    severity: warning
  - id: boot-context-test-on-wiring-change
    description: "배선/설정 변경 시 @SpringBootTest 컨텍스트 로드 테스트가 있어야 한다(mock 없이)"
    severity: error
