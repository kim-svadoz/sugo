harnessId: framework/spring/4.x
checks:
  - id: jackson3-only
    description: "com.fasterxml.jackson.* (Jackson 2) API를 사용하지 않아야 한다(Jackson 3)"
    severity: error
  - id: junit5-only
    description: "JUnit 4(org.junit.Test/@RunWith) 테스트를 새로 작성하지 않아야 한다"
    severity: error
  - id: no-undertow
    description: "Undertow를 서블릿 컨테이너로 지정하지 않아야 한다(4.0에서 제거)"
    severity: error
  - id: explicit-autoconfigure-modules
    description: "분할된 자동설정 모듈 의존성을 명시적으로 선언해야 한다"
    severity: warning
  - id: framework-api-versioning
    description: "API 버전을 URL에 수동으로 박지 않고 프레임워크의 API 버저닝을 사용해야 한다"
    severity: warning
  - id: jspecify-nullability
    description: "널 안정성 표기가 JSpecify(@NullMarked/@Nullable) 기준이어야 한다"
    severity: warning
