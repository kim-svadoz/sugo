harnessId: framework/nextjs/16.x
checks:
  - id: no-sync-request-apis
    description: "동기 요청 API 접근(cookies/headers/params/searchParams)이 남아 있지 않아야 한다(16에서 제거됨)"
    severity: error
  - id: proxy-not-middleware
    description: "middleware.ts 대신 proxy.ts(export function proxy)를 사용해야 한다"
    severity: error
    auto:
      kind: file-absent
      paths: ["middleware.ts", "middleware.js", "src/middleware.ts", "src/middleware.js"]
  - id: proxy-node-runtime
    description: "proxy.ts 코드가 Node.js 런타임 전제로 작성되어야 한다"
    severity: warning
  - id: turbopack-compatible-config
    description: "커스텀 webpack 설정 의존이 Turbopack 기본 환경에서도 성립해야 한다"
    severity: warning
