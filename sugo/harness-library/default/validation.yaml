harnessId: default
checks:
  - id: no-debug-output
    description: "커밋 대상에 console.log/print/System.out.println 등 디버그 출력이 남아있지 않아야 한다"
    severity: warning
  - id: no-secrets
    description: "API 키/토큰/비밀번호로 보이는 문자열 리터럴이 없어야 한다"
    severity: error
  - id: no-empty-catch
    description: "catch/except 블록이 비어있거나 로그 없이 무시하지 않아야 한다"
    severity: warning
