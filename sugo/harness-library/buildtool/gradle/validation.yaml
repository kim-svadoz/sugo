harnessId: buildtool/gradle
checks:
  - id: wrapper-committed
    description: "gradlew/gradlew.bat이 저장소에 커밋되어 있어야 한다"
    severity: error
    auto:
      kind: file-exists
      paths: ["gradlew", "gradlew.bat"]
  - id: version-centralized
    description: "의존성 버전이 버전 카탈로그 또는 ext로 중앙관리되어야 한다"
    severity: warning
