harnessId: buildtool/maven
checks:
  - id: wrapper-committed
    description: "mvnw/mvnw.cmd가 저장소에 커밋되어 있어야 한다"
    severity: warning
    auto:
      kind: file-exists
      paths: ["mvnw"]
  - id: no-skip-tests-flag-committed
    description: "-DskipTests/maven.test.skip 등 테스트 스킵 설정이 커밋된 빌드 설정에 없어야 한다"
    severity: error
    auto:
      kind: file-content-absent
      paths: ["pom.xml"]
      pattern: "(-DskipTests|maven\\.test\\.skip|<skipTests>\\s*true)"
